name: Audit autofix

on:
  push:
    branches:
      - comprehensive-bug-audit-2026-09-10

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: comprehensive-bug-audit-2026-09-10
          fetch-depth: 0

      - name: Apply audited fixes
        run: python audit_autofix2.py

      - name: Commit audited fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Fix comprehensive production audit findings"
          git push origin HEAD:comprehensive-bug-audit-2026-09-10
