name: Premium icon CSP fix

on:
  push:
    branches:
      - premium-svg-csp-fix-2026-09-10

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: premium-svg-csp-fix-2026-09-10
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fix icon hover geometry and verify CSP
        run: |
          python - <<'PY'
          from pathlib import Path
          css_path = Path('assets/premium-icons.css')
          css = css_path.read_text(encoding='utf-8')
          old = '[data-page="insights"] .article-row:hover::after{transform:translate(2px,-2px);opacity:.9}'
          new = '[data-page="insights"] .article-row:hover::after{transform:translate(2px,calc(-50% - 2px));opacity:.9}'
          if old not in css:
              raise SystemExit('Expected Insights hover rule not found')
          css_path.write_text(css.replace(old, new, 1), encoding='utf-8')

          headers = Path('_headers').read_text(encoding='utf-8')
          if "img-src 'self' data:;" not in headers:
              raise SystemExit('CSP does not allow image data URIs')
          if 'data:image/svg+xml' not in css:
              raise SystemExit('Premium SVG data URI system missing')
          PY

      - name: Install QA dependency
        run: python -m pip install beautifulsoup4

      - name: Run QA gates
        run: |
          python qa_audit.py
          python quality_gate.py
          git diff --check

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/premium-icon-csp-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize premium SVG icon delivery and CSP"
          git push origin HEAD:premium-svg-csp-fix-2026-09-10
